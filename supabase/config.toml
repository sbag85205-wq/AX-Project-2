project_id = "knowly"

[auth]
# 회원가입은 막고 관리자가 계정을 발급한다
enable_signup = false

[auth.email]
# 이메일 로그인 방식 자체는 켜 둔다 (false면 호스팅 환경에서 이메일 로그인이 꺼짐)
enable_signup = true
enable_confirmations = false

# 새 API 키(sb_publishable/sb_secret)와 비대칭 JWT를 쓰는 프로젝트는
# 게이트웨이 JWT 검사 대신 함수 안에서 auth.getUser()로 토큰을 검증한다
[functions.chat]
verify_jwt = false

[functions.ingest]
verify_jwt = false

[functions.admin-users]
verify_jwt = false
