# main의 supabase/ 폴더가 바뀌면 DB 변경(migration)과 Edge Function을 배포한다.
# 두 사이트가 같은 Supabase를 쓰므로 백엔드는 main에서만 배포한다 (냥대리 브랜치는 main을 합쳐서 따라온다).
# 필요한 저장소 비밀값: SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['supabase/**']
  workflow_dispatch:

concurrency:
  group: backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ozzifomiikxavdbmvxqk
    steps:
      - name: 비밀값 확인
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::저장소 비밀값 SUPABASE_ACCESS_TOKEN이 없어서 배포하지 않았어요."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: 적용할 DB 변경 미리 보기
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --dry-run
      - name: DB 변경 적용
        run: supabase db push --remote="$SUPABASE_PROJECT_REF" --yes
      - name: Edge Function 배포
        run: supabase functions deploy --use-api --remote="$SUPABASE_PROJECT_REF" --yes
